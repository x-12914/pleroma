services:
  # FastAPI Backend Web Service
  - type: web
    name: aicds-backend
    env: python
    # Build dependencies
    buildCommand: pip install -r requirements.txt
    # Start the FastAPI application
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    # Environment configuration
    envVars:
      # Database connection string (auto-provided by Render)
      - key: DATABASE_URL
        fromDatabase:
          name: aicds-db
          property: connectionString
      # Python version
      - key: PYTHON_VERSION
        value: 3.11.0
      # External API Keys (set these in Render dashboard)
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  # PostgreSQL Database for AICDS
  - name: aicds-db
    databaseName: aicds
    user: aicds_user
    plan: free # Change to 'standard' for production (512MB+ storage)