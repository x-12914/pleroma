# /etc/nginx/conf.d/pleroma-ratelimit.conf
#
# Worker-independent rate limiting for Pleroma's auth endpoints. The app's own
# slowapi limiter is per-worker (in-memory), so with --workers 2 the effective
# cap is ~2x and uneven. nginx is the single ingress, so limiting here is exact.
#
# This MUST live in the http{} context — hence conf.d/ (which nginx includes into
# http{}), NOT inside the server block. The matching `limit_req` directive lives
# in the pleroma vhost's `location /api/v1/auth/` block (see nginx-pleroma.conf).
#
# Keyed on the real client IP at the edge ($binary_remote_addr = the IP connecting
# to nginx). 10 requests/minute with a small burst absorbs normal logins while
# throttling brute-force.
limit_req_zone $binary_remote_addr zone=pleroma_auth:10m rate=10r/m;
