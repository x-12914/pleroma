# /etc/nginx/sites-available/pleroma-aicds
#
# Deploy:
#   sudo cp deploy/nginx-pleroma.conf /etc/nginx/sites-available/pleroma-aicds
#   sudo ln -s /etc/nginx/sites-available/pleroma-aicds /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pleroma-aicds.duckdns.org
#
# After certbot runs, the listen 443 ssl block and the http→https redirect
# are added automatically — no manual TLS config needed here.
#
# Coexists with the existing bible-pointer vhost: this one only matches
# requests for pleroma-aicds.duckdns.org by Host header.

server {
    listen 80;
    listen [::]:80;
    server_name pleroma-aicds.duckdns.org;

    # Built React static files
    root /opt/pleroma/frontend-dist;
    index index.html;

    # Backend API → FastAPI on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback so React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (defense in depth for the served SPA + API).
    # `always` so they're sent on error responses too. HSTS is intentionally
    # NOT here — it must only be sent over HTTPS; add it in the certbot-managed
    # 443 server block (see note below).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Tight-ish CSP for a self-contained SPA + same-origin API. Loosen only if
    # you add third-party scripts/styles. 'unsafe-inline' for styles is kept
    # because many bundlers inject inline <style>; tighten with hashes if needed.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # On the HTTPS (443) server block that certbot creates/edits, also add:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable defaults
    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
}
